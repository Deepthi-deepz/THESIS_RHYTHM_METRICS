experiment_name: npvi_rho2_train960
dataset_name: train_960

alignment_csvs:
  - /home/varghese@alabsad.fau.de/Thesis/Rhythm_Metrics/data/phones_csv/aligned_100.csv
  - /home/varghese@alabsad.fau.de/Thesis/Rhythm_Metrics/data/phones_csv/aligned_360.csv
  - /home/varghese@alabsad.fau.de/Thesis/Rhythm_Metrics/data/phones_csv/aligned_500.csv

output_dir: results/train_960_nPVI

random_seed: 42
n_trials_per_condition: 10000

utterances_per_side: [1, 3, 5, 10, 20, 40, 60]
min_adj_pairs: [1, 3, 5, 10, 20]

phoneset:
  use_phones39: true
  vowels:
    - AA
    - AE
    - AH
    - AO
    - AW
    - AY
    - EH
    - ER
    - EY
    - IH
    - IY
    - OW
    - OY
    - UH
    - UW

tables:
  - name: npvi_all
    mode: all
  - name: npvi_vowel
    mode: vowel
  - name: npvi_consonant
    mode: consonant