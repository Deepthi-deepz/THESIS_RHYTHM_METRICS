dataset_name: "librispeech_train_clean_360"

alignment_csvs:
  - "data/alignments/train_clean_360_alignments.csv"

output_dir: "results/librispeech_train_clean_360"

random_seed: 42
n_trials_per_condition: 10000

utterances_per_side:
  - 1
  - 3
  - 5
  - 10
  - 20
  - 40
  - 60

min_adj_pairs:
  - 1
  - 3
  - 5
  - 10
  - 20

min_eligible_speakers: 100

phoneset:
  use_phones39: true
  vowels:
    - AA
    - AE
    - AH
    - AO
    - AW
    - AY
    - EH
    - ER
    - EY
    - IH
    - IY
    - OW
    - OY
    - UH
    - UW
